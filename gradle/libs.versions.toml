kotlin = "2.4.20"
# 已核实：https://developer.android.google.cn/build/releases/agp-9-4-0-release-notes（2026-09）
agp = "9.4.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

[plugins]
