# ⚠️ 临时逃生开关：本仓库路径含非 ASCII 字符（D:\code\安卓相关）。
# AGP 默认拒绝在此类路径下构建，官方给出的开关就是这个。
#
# 官方警告原文：「This will most likely cause the build to fail on Windows」
# —— 即 AGP 自己也不保证可用。当前为实测阶段，若后续 aapt2 / aidl / NDK
# 环节出现路径相关问题，必须把仓库迁移到纯 ASCII 路径，而不是继续加开关。
#
# 决策与迁移方案见 docs/30-architecture/ADR-0002-non-ascii-project-path.md
# ─────────────────────────────────────────────────────────────
android.overridePathCheck=true

